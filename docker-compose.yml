version: '3.8'

services:
  # Askara Web Application
  askara-web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: askara-web
    ports:
      - "8100:8100"
    environment:
      # LLM Provider Selection
      - LLM_PROVIDER=${LLM_PROVIDER:-ollama}

      # OpenAI Configuration (only needed if LLM_PROVIDER=openai)
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - OPENAI_MODEL=${OPENAI_MODEL:-gpt-4}
      - OPENAI_EMBEDDING_MODEL=${OPENAI_EMBEDDING_MODEL:-text-embedding-ada-002}

      # Ollama Configuration (only needed if LLM_PROVIDER=ollama)
      - OLLAMA_HOST=${OLLAMA_HOST:-http://host.docker.internal:11434}
      - OLLAMA_MODEL=${OLLAMA_MODEL:-llama2}
      - OLLAMA_EMBEDDING_MODEL=${OLLAMA_EMBEDDING_MODEL:-nomic-embed-text}

      # Vector Database Configuration
      - QDRANT_API_ENDPOINT=${QDRANT_API_ENDPOINT:-http://qdrant:6333}

      # Optional: Pinecone Configuration (alternative to Qdrant)
      - PINECONE_API_ENDPOINT=${PINECONE_API_ENDPOINT:-}
      - PINECONE_API_KEY=${PINECONE_API_KEY:-}

      # Application Configuration
      - PORT=${PORT:-8100}
      - DEBUG_SITE=${DEBUG_SITE:-false}

      # ML Worker Configuration (optional)
      - ML_WORKER_ENABLED=${ML_WORKER_ENABLED:-false}
      - ML_WORKER_ENDPOINT=${ML_WORKER_ENDPOINT:-http://192.168.0.250:6161/askara}
      - ML_WORKER_FEATURES=${ML_WORKER_FEATURES:-ocr,enhance,caption}
      - ML_WORKER_TIMEOUT=${ML_WORKER_TIMEOUT:-30}

      # Query Rewriting (optional, uses local Ollama)
      - QUERY_REWRITE_ENABLED=${QUERY_REWRITE_ENABLED:-false}

    volumes:
      # Persist document data
      - ./data:/app/data
      # Persist uploaded documents
      - askara-documents:/app/data/documents
    depends_on:
      qdrant:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - askara-network
    extra_hosts:
      # Enable access to host machine for Ollama connectivity
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8100/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Qdrant Vector Database
  qdrant:
    image: qdrant/qdrant:latest
    container_name: askara-qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant-storage:/qdrant/storage
    environment:
      - QDRANT__SERVICE__GRPC_PORT=6334
    restart: unless-stopped
    networks:
      - askara-network
    healthcheck:
      test: ["CMD-SHELL", "timeout 5 bash -c '</dev/tcp/localhost/6333' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  # Named volume for Qdrant data persistence
  qdrant-storage:
    driver: local

  # Named volume for document storage
  askara-documents:
    driver: local

networks:
  askara-network:
    driver: bridge
